<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schieber | Jasstisch</title>
  <meta name="description" content="Schieber online spielen: Jass gegen den Computer, direkt im Browser.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css?v=19">
</head>
<body class="game-page" data-game="schieber">
  <header class="topbar">
    <div class="topleft">
      <button type="button" class="reset-btn" id="btn-reset" title="Spiel neu starten">&#8635; Neu</button>
      <a class="brand" href="index.html"><span class="logo" aria-hidden="true"></span>Jasstisch</a>
    </div>
    <div class="tempo" role="group" aria-label="Tempo">
      <button type="button" data-speed="langsam">Langsam</button>
      <button type="button" data-speed="normal" class="on" aria-pressed="true">Normal</button>
      <button type="button" data-speed="schnell">Schnell</button>
    </div>
    <nav>
      <a href="index.html">Spielen</a>
      <a href="rules.html">Regeln</a>
    </nav>
  </header>

  <!-- Einstellungen -->
  <main id="setup" class="setup">
    <a class="back" href="index.html">&larr; Zurück</a>
    <h1>Schieber</h1>
    <p class="lead">Das klassische Schweizer Jass-Spiel für 4 Spieler in 2er-Teams. Wähle Trumpf und versuche, die Gegner zu überbieten.</p>

    <div class="mode-grid" role="group" aria-label="Spielmodus">
      <button type="button" class="mode on" id="mode-online" data-mode="online" aria-pressed="true">
        <strong>Online spielen</strong>
        <span>Lobby erstellen oder Code eingeben</span>
      </button>
      <button type="button" class="mode" id="mode-local" data-mode="local" aria-pressed="false">
        <strong>Gegen Computer</strong>
        <span>Gegen KI-Gegner üben</span>
      </button>
    </div>

    <section class="panel">
      <h2>Regeln</h2>
      <div class="field">
        <span class="label">Zielpunktzahl</span>
        <div class="seg">
          <label><input type="radio" name="target" value="1000" checked><span>1000</span></label>
          <label><input type="radio" name="target" value="1500"><span>1500</span></label>
        </div>
      </div>
      <label class="switch"><input type="checkbox" id="opt-weis" checked><span></span> <div><b>Weisen</b><small>Kartenkombinationen für Bonuspunkte ansagen</small></div></label>
      <label class="switch"><input type="checkbox" id="opt-stoeck" checked><span></span> <div><b>Stöck</b><small>Trumpf König-Dame Paar: +20 Punkte</small></div></label>
      <label class="switch"><input type="checkbox" id="opt-match"><span></span> <div><b>Match Bonus</b><small>+100 Punkte, wenn alle 9 Stiche gewonnen werden</small></div></label>
      <label class="switch"><input type="checkbox" id="opt-schilten" checked><span></span> <div><b>Schilten doppelt</b><small>Alle Punkte werden verdoppelt, wenn Schilten Trumpf ist</small></div></label>
      <label class="switch"><input type="checkbox" id="opt-schellen7"><span></span> <div><b>Schellen-7 bestimmt</b><small>Wer die Schellen-7 hat, wählt den Trumpf</small></div></label>
    </section>

    <button type="button" class="btn primary wide" id="btn-start">Spiel starten</button>
    <p class="muted small">Gratis. Ohne Registrierung. Läuft im Browser.</p>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <!-- Tisch -->
  <main id="table" class="table-view" hidden>
    <div class="table-layout">
      <section class="board" aria-label="Spieltisch">
        <div class="seat" id="seat-2"></div>
        <div class="seat" id="seat-3"></div>
        <div class="seat" id="seat-1"></div>

        <div class="felt">
          <div class="felt-names" aria-hidden="true">
            <span class="fn fn-top" id="fn-top"></span>
            <span class="fn fn-left" id="fn-left"></span>
            <span class="fn fn-right" id="fn-right"></span>
            <span class="fn fn-bottom" id="fn-bottom"></span>
          </div>
          <div class="felt-top">
            <span class="trumpbadge" id="trumpbadge">Kein Trumpf</span>
            <span class="target" id="target"></span>
          </div>
          <div class="weis-slot" id="weis"></div>
          <div class="trick" id="trick"></div>
          <div class="felt-center">
            <div class="felt-msg" id="felt-msg" aria-live="polite"></div>
            <div class="picker" id="picker"></div>
          </div>
        </div>

        <div class="seat" id="seat-0"></div>
        <div class="hand" id="hand"></div>
      </section>

      <aside class="side" aria-label="Jasstafel">
        <section class="jasstafel">
        <div class="score">
          <div class="team-score team0" id="score-0"></div>
          <div class="team-score team1" id="score-1"></div>
        </div>
        <div class="tabs">
          <button type="button" class="on" data-tab="chalk">Jasstafel</button>
          <button type="button" data-tab="history">Spielverlauf</button>
        </div>
        <div id="tab-chalk" class="chalk" aria-label="Kreidetafel">
          <div id="chalk" class="chalk-row"></div>
        </div>
        <div id="tab-history" class="history" hidden>
          <div id="history"></div>
        </div>
        </section>
        <button type="button" class="btn ghost small" id="btn-leave">Spiel verlassen</button>
      </aside>
    </div>

    <div class="modal" id="modal" hidden>
      <div class="sheet" role="dialog" aria-modal="true"></div>
    </div>
  </main>

  <script src="js/clock.js?v=9"></script>
  <script src="js/tempo.js?v=9"></script>
  <script src="js/rules.js?v=11"></script>
  <script src="js/tablelayout.js?v=2"></script>
  <script src="js/ai-schieber.js?v=11"></script>
  <script src="js/game.js?v=14"></script>
  <script src="js/fx.js?v=9"></script>
  <script src="js/ui.js?v=16"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/mental.js?v=11"></script>
  <script src="js/mental-round.js?v=13"></script>
  <script src="js/view.js?v=12"></script>
  <script src="js/online.js?v=15"></script>
  <script src="js/lobby-ui.js?v=16"></script>
</body>
</html>
